name: Import NPB schedule

# 目的: 指定した NPB 日程詳細ページからジャイアンツ戦を取り込み、日程スナップショットを更新する。
# 実行時刻: 定期実行なし。GitHub Actions の画面から対象ページの URL を指定して手動で起動する。
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: NPB日程詳細ページのHTTPS URL
        required: true
        type: string

permissions:
  contents: write

jobs:
  import-schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Fetch NPB schedule page
        shell: bash
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 --output "$RUNNER_TEMP/npb-schedule-source.html" "$SOURCE_URL"
      - name: Extract Giants games and merge snapshot
        env:
          GEMINI_APIKEY: ${{ secrets.GEMINI_APIKEY }}
        run: |
          python scripts/import_npb_schedule.py \
            --source "$RUNNER_TEMP/npb-schedule-source.html" \
            --json-output "$RUNNER_TEMP/npb-schedule-games.json"
      - name: Commit imported schedule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots
          git diff --cached --quiet || git commit -m "Import NPB schedule"
          git push