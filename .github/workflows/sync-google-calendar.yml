name: Sync Giants Google calendar

# 目的: リポジトリ内の最新の試合日程を Google カレンダーへ同期する。
# 実行時刻: 毎日 22:00 UTC（日本時間の翌日 07:00）。
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

concurrency:
  group: sync-giants-google-calendar

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Sync Google Calendar
        env:
          GIANTS_CALENDER_API: ${{ secrets.GIANTS_CALENDER_API }}
          GIANTS_CALENDAR_ID: ${{ vars.GIANTS_CALENDAR_ID }}
        run: python scripts/sync_google_calendar.py
