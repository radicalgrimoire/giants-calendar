name: Probe Giants schedule

# 目的: 指定月の球団公式日程ページを取得・検査し、ページ構造やイベント情報を確認する。
# 実行時刻: 定期実行なし。GitHub Actions の画面から手動で起動したときにのみ処理する。
on:
  workflow_dispatch:
    inputs:
      month:
        description: 対象月（YYYYMM）
        required: true
        type: string
        default: "202603"

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/giants-schedule-probe" --no-save --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/giants-schedule-probe/node_modules/.bin/playwright" install --with-deps chromium
      - name: Fetch and inspect schedule
        env:
          SCHEDULE_MONTH: ${{ inputs.month }}
        run: |
          node <<'NODE'
          const { chromium } = require(`${process.env.RUNNER_TEMP}/giants-schedule-probe/node_modules/playwright`);

          async function main() {
            const month = process.env.SCHEDULE_MONTH;
            if (!/^\d{4}(0[1-9]|1[0-2])$/.test(month)) {
              throw new Error("対象月はYYYYMM形式で指定してください。");
            }

            const url = new URL("https://www.giants.jp/schedule/first-team/");
            url.searchParams.set("month", month);
            const browser = await chromium.launch();
            try {
              const page = await browser.newPage();
              const response = await page.goto(url.href, { waitUntil: "domcontentloaded", timeout: 30000 });
              if (!response || !response.ok()) {
                throw new Error(`日程ページの取得に失敗しました: HTTP ${response ? response.status() : "応答なし"}`);
              }
              const data = await page.locator("script#__NEXT_DATA__").textContent({ timeout: 10000 });
              const props = JSON.parse(data).props.pageProps;
              if (props.month !== month || !Array.isArray(props.calenderDayInfo)) {
                throw new Error("対象月の日程データが見つからないか、形式が変わっています。");
              }
              let count = 0;
              for (const entry of props.calenderDayInfo) {
                const date = entry.dayInfo?.date;
                if (!date) throw new Error("日付のない日程データが見つかりました。");
                const titles = [];
                if (entry.dayInfo.eventInfo?.title) titles.push(entry.dayInfo.eventInfo.title);
                for (const button of entry.buttons || []) {
                  if (button.type?.startsWith("campaign") && button.text) titles.push(button.text);
                }
                for (const title of titles) {
                  console.log(`${date}: ${title}`);
                  count++;
                }
              }
              console.log(`HTTP ${response.status()}; ${month}: ${count} 件のイベントを検出`);
            } finally {
              await browser.close();
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
