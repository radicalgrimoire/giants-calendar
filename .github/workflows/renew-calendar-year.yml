name: Renew Giants calendar year

on:
  schedule:
    - cron: "0 7 1 1 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  renew-calendar-year:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python scripts/renew_calendar_year.py
      - name: Commit renewed calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Renew Giants calendar year"
          git push
