name: Update Giants calendar

on:
  push:
    paths:
      - ".github/workflows/update-calendar.yml"
      - "requirements.txt"
      - "scripts/**"
      - "data/calendar-year.txt"
  schedule:
    - cron: "0 19 28-29 2 *"
    - cron: "0 19 * 3-10 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-season:
    runs-on: ubuntu-latest
    outputs:
      run_update: ${{ steps.season.outputs.run_update }}
    steps:
      - id: season
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$(TZ=Asia/Tokyo date +%m-%d)" in
              03-*|04-*|05-*|06-*|07-*|08-*|09-*|10-*|11-01) ;;
              *) echo "run_update=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
          fi
          echo "run_update=true" >> "$GITHUB_OUTPUT"

  update-calendar:
    needs: check-season
    if: ${{ needs.check-season.outputs.run_update == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python scripts/save_snapshot.py
      - name: Check NPB cancellations
        env:
          GEMINI_APIKEY: ${{ secrets.GEMINI_APIKEY }}
        run: python scripts/check_npb_cancellations.py
      - run: python scripts/generate_calendar.py
      - name: Commit generated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update Giants calendar"
          git push
