name: Update Giants calendar

on:
  push:
    paths:
      - ".github/workflows/save-snapshot.yml"
      - ".github/workflows/update-calendar.yml"
      - "requirements.txt"
      - "scripts/**"
      - "data/calendar-year.txt"
  schedule:
    - cron: "0 7 2-31 1 *"
    - cron: "0 7 * 2-12 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  save-snapshot:
    uses: ./.github/workflows/save-snapshot.yml

  update-calendar:
    needs: save-snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore updated snapshots
        uses: actions/download-artifact@v4
        with:
          name: giants-calendar-snapshots
          path: data/snapshots/
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python scripts/generate_calendar.py
      - name: Commit generated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update Giants calendar"
          git push
