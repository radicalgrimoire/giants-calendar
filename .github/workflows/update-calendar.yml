name: Update Giants calendar

# 目的: 読売ジャイアンツ公式日程を取得し、カレンダーと日程スナップショットを最新化する。
# 実行時刻: 毎日 19:00 UTC（日本時間の翌日 04:00）。定期実行はシーズン中（3月〜11月1日）のみ更新する。
on:
  push:
    paths:
      - ".github/workflows/update-calendar.yml"
      - "requirements.txt"
      - "scripts/**"
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      month:
        description: 球団公式の日程を手動取得する月（YYYYMM、任意）
        required: false
        type: string
      game_date:
        description: 試合詳細を手動再取得する日（YYYY-MM-DD、任意）
        required: false
        type: string

concurrency:
  group: update-giants-calendar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-season:
    runs-on: ubuntu-latest
    outputs:
      run_update: ${{ steps.season.outputs.run_update }}
    steps:
      - id: season
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$(TZ=Asia/Tokyo date +%m-%d)" in
              03-*|04-*|05-*|06-*|07-*|08-*|09-*|10-*|11-01) ;;
              *) echo "run_update=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
          fi
          echo "run_update=true" >> "$GITHUB_OUTPUT"

  update-calendar:
    needs: check-season
    if: ${{ needs.check-season.outputs.run_update == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Set up Node
        id: node
        uses: actions/setup-node@v4
        continue-on-error: true
        with:
          node-version: "22"
      - name: Fetch Giants official schedule
        id: giants
        if: steps.node.outcome == 'success'
        continue-on-error: true
        env:
          SCHEDULE_MONTH: ${{ inputs.month }}
          GAME_DATE: ${{ inputs.game_date }}
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/giants-schedule" --no-save --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/giants-schedule/node_modules/.bin/playwright" install --with-deps chromium
          export NODE_PATH="$RUNNER_TEMP/giants-schedule/node_modules"
          args=()
          if [ -n "$SCHEDULE_MONTH" ]; then args+=(--month "$SCHEDULE_MONTH"); fi
          if [ -n "$GAME_DATE" ]; then args+=(--date "$GAME_DATE"); fi
          node scripts/fetch_giants_schedule.cjs "${args[@]}"
      - run: python scripts/save_snapshot.py
        if: ${{ !inputs.month && !inputs.game_date }}
      - name: Check NPB cancellations
        if: ${{ !inputs.month && !inputs.game_date }}
        env:
          GEMINI_APIKEY: ${{ secrets.GEMINI_APIKEY }}
        run: python scripts/check_npb_cancellations.py
      - run: python scripts/generate_calendar.py
      - name: Commit generated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update Giants calendar"
          git push
      - name: Report official schedule fetch failure
        if: steps.node.outcome == 'failure' || steps.giants.outcome == 'failure'
        run: |
          echo "::error::球団公式の取得に失敗しました。既存のデータを維持しました。"
          exit 1
