name: Archive Giants calendar

on:
  schedule:
    - cron: "0 19 30 11 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive-calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Generate this year's archive
        run: |
          year=$(TZ=Asia/Tokyo date +%Y)
          python scripts/generate_calendar.py --year "$year" --output "backlog/giants-${year}.ics"
      - name: Commit archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backlog
          git diff --cached --quiet || git commit -m "Archive Giants calendar"
          git push
