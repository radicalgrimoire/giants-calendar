name: Save Giants calendar snapshot

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      publish_artifact:
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  save-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python scripts/save_snapshot.py
      - name: Share snapshots with caller
        if: ${{ inputs.publish_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: giants-calendar-snapshots
          path: data/snapshots/
          if-no-files-found: error
      - name: Commit snapshot
        if: ${{ !inputs.publish_artifact }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots
          git diff --cached --quiet || git commit -m "Save Giants calendar snapshot"
          git push